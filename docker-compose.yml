# Menjalankan PostgreSQL lokal:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: company_profile_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: company_profile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_profile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
